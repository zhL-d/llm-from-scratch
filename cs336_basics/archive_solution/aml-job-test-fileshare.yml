# Azure ML Job Configuration - QUICK TEST (Using Existing File Share)
# Uses corpus.en from your existing Azure File Share

$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json

# Job metadata
display_name: bpe-test-corpus-en-fileshare
experiment_name: bpe-tokenizer-test
description: Quick test with corpus.en from existing file share (130KB, vocab 500)

# Compute target
compute: azureml:cpu-cluster

# Code and command
code: .
command: >-
  uv sync --frozen &&
  uv run python cs336_basics/train_bpe.py

# Environment
environment:
  image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu22.04:latest
  conda_file: conda-env.yml

# Data inputs (use existing file share directly)
inputs:
  training_data:
    type: uri_folder
    path: azureml://datastores/cs336zhl-fileshare/paths/
    mode: ro_mount

# Environment variables (small test case)
environment_variables:
  # Use corpus.en for quick test
  TRAINDATA_PATH: ${{inputs.training_data}}/corpus.en
  VOCAB_SIZE: "500"
  CONFIG_PATH: cs336_basics/config_azure_trial.yaml

  # Output config
  OUTPUTS_PATH: ./outputs
  ENABLE_LOG: "true"

  # Use fewer cores for small dataset (avoid overhead)
  PRETOKEN_PROCS: "4"

# Outputs
outputs:
  model:
    type: uri_folder
    mode: rw_mount

# Job settings
limits:
  timeout: 600  # 10 minutes max (test should complete in <1 min)

# Tags
tags:
  dataset: corpus-en
  vocab_size: "500"
  test: "true"
  source: existing-fileshare