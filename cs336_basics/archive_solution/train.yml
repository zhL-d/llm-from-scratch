on:
  workflow_dispatch:
    inputs:
      imageTag:
        description: Docker tag to deploy
        default: latest   # aligns with .env IMAGE_TAG
      traindataPath:
        description: Path of training data
        default: /data/tokenizer/corpus.en
      vocabSize:
        description: Vocabulary size (string)
        default: "500"  # aligns with .env VOCAB_SIZE
      storageAccount:
        description: set azure Storage Account
      cpu:
        description: vCPU (string)
        default: "1"
      memoryGi:
        description: Memory in Gi (string, it will add Gi)
        default: "2"
      workloadProfile:
        description: Optional Dedicated profile (leave blank to use default)
        default: ""
      # alertEmailAddress:
      #   description: Email Address for alert 
      #   default: "lucas.zeh.lu@gmail.com"


permissions:
  id-token: write
  contents: read

env:
  RG: bpe-rg                        # change to your resource group
  JOB: bpe-train                    # must match infra/main.bicep output name
  ACR: zhlacr                       # change to your ACR name
  IMAGE_REPO: cs336-bpe
  LOCATION: switzerlandnorth        # change if needed
  ARTIFACTS_CONTAINER: bpe-artifacts  # aligns with .env default
  # STORAGE_ACCOUNT: ""                # optional; set only if needed

jobs:
  build-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # - name: Build & Push
      #   uses: docker/build-push-action@v5
      #   with:
      #     context: .
      #     file: Dockerfile.prod
      #     push: true
      #     tags: ${{ env.ACR }}.azurecr.io/${{ env.IMAGE_REPO }}:${{ inputs.imageTag }}
      #     provenance: true

      - name: Update ACA Job
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail
            IMAGE="${ACR}.azurecr.io/${IMAGE_REPO}:${{ inputs.imageTag }}"
            CPU="${{ inputs.cpu }}"
            MEM="${{ inputs.memoryGi }}Gi"
            WP="${{ inputs.workloadProfile }}"
            # Build env vars string aligned with .env defaults
            ENV_VARS="TRAINDATA_PATH=${{ inputs.traindataPath }} VOCAB_SIZE=${{ inputs.vocabSize }} LOG_DIR=cs336_basics/outputs IMAGE_TAG=${{ inputs.imageTag }} ARTIFACTS_CONTAINER=${ARTIFACTS_CONTAINER} RUN_CONTEXT=AZURE AZURE_MONITOR_WEBHOOK="
            # Only include STORAGE_ACCOUNT if provided
            if [ -n "${{ inputs.storageAccount }}" ]; then
              ENV_VARS="$ENV_VARS STORAGE_ACCOUNT=${{ inputs.storageAccount }}"
            fi

            ARGS=( --image "$IMAGE" --cpu "$CPU" --memory "$MEM" --set-env-vars $ENV_VARS )
            if [ -n "$WP" ]; then ARGS+=( --workload-profile "$WP" ); fi
            az containerapp job update -g "$RG" -n "$JOB" "${ARGS[@]}"

      # - name: Start Execution + Stream Logs
