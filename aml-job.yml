# Azure ML Job Configuration for BPE Tokenizer Training
# Industry best practice: Declarative job definition with automatic monitoring

$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json

# Job metadata
display_name: bpe-training-vocab-32000
experiment_name: bpe-tokenizer
description: Train BPE tokenizer with multiprocessing on large dataset

# Compute target
compute: azureml:cpu-cluster

# Code and command
code: .
command: >-
  uv sync --frozen &&
  uv run python cs336_basics/train_bpe.py

# Environment: Use curated Python image + install uv
environment:
  image: mcr.microsoft.com/azureml/curated/sklearn-1.5-ubuntu22.04-py39-cpu:latest

# OR use custom conda environment (recommended for reproducibility)
# environment:
#   conda_file: conda-env.yml
#   image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu22.04:latest

# Data inputs (mounted from uploaded data)
inputs:
  training_data:
    type: uri_folder
    path: azureml:bpe-training-data@latest
    mode: ro_mount

# Environment variables (overrides config file)
environment_variables:
  # Training config
  TRAINDATA_PATH: ${{inputs.training_data}}/owt_train.txt
  VOCAB_SIZE: "32000"
  CONFIG_PATH: cs336_basics/config_azure_trial.yaml

  # Output config
  OUTPUTS_PATH: ./outputs
  ENABLE_LOG: "true"

  # Multiprocessing config
  PRETOKEN_PROCS: "32"  # Use all 32 cores on D32

# Outputs (automatically uploaded to workspace)
outputs:
  model:
    type: uri_folder
    mode: rw_mount

# Resource limits
resources:
  instance_count: 1

# Job settings
limits:
  timeout: 43200  # 12 hours max

# Tags for filtering/organization
tags:
  dataset: openwebtext
  vocab_size: "32000"
  framework: custom-bpe
  multiprocessing: "true"